name: Keep API warm

# Render's free tier spins an instance down after ~15 minutes without inbound
# traffic, and the next request then pays a 30-60s cold start. Because the
# dashboard blocks on /api/profile and /api/dashboard, that cold start is felt
# as "the dashboard takes forever to load".
#
# Pinging /health every 10 minutes keeps the instance up. The endpoint is
# unauthenticated and touches no database, so this is a cheap request.
#
# Caveats worth knowing:
#  - GitHub's scheduled runners are best-effort. Under load a */10 cron can slip
#    past the 15-minute idle window, so expect the occasional cold start anyway.
#  - GitHub disables scheduled workflows in public repos after 60 days with no
#    commits. If the repo goes quiet, re-enable it from the Actions tab.
#  - This does not make the app fast, it makes it not-slow more often. The real
#    fix is a paid instance with no spin-down.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # allows a manual wake-up from the Actions tab

# A ping that started while the previous one is still waiting out a cold start
# adds nothing.
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          API_URL: https://raceiq-api.onrender.com
        run: |
          # --max-time 90 rather than the default: a cold start legitimately takes
          # up to ~60s, and timing out early would defeat the purpose.
          # --retry covers a spin-up that returns 502 before the app binds.
          code=$(curl --silent --show-error \
                      --location \
                      --max-time 90 \
                      --retry 3 --retry-delay 10 --retry-all-errors \
                      --write-out '%{http_code}' \
                      --output /dev/null \
                      "$API_URL/health")

          echo "GET $API_URL/health -> $code"

          if [ "$code" != "200" ]; then
            echo "::error::Health check returned $code"
            exit 1
          fi
